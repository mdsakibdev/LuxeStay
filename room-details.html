<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details | LuxeStay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-900">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold text-white">Luxe<span class="text-amber-500">Stay</span></a>
            <a href="index.html" class="text-xs font-semibold text-amber-500 hover:text-amber-400 flex items-center gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Back to Rooms
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full">
        <div id="room-detail-view" class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <!-- Content dynamically rendered via JS based on ?id=X -->
            <div class="lg:col-span-3 text-center py-20">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-500"></i>
                <p class="text-slate-400 text-sm mt-3">Loading accommodation details...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 text-center text-xs">
        <p>&copy; 2026 LuxeStay International. All Rights Reserved.</p>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
